name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch cancels the previous run - no point finishing a
# build for a commit that has already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # ci, not install: installs exactly what the lockfile says and fails if
      # package.json and the lockfile disagree.
      - name: Install dependencies
        run: npm ci

      # Covers the legacy JS bot and the TypeScript workspaces in one pass.
      - name: Lint
        run: npx eslint .

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tsc -b walks the project references, so shared/ is built before server/.
      - name: Typecheck
        run: npm run typecheck

  test-legacy:
    name: Test (legacy bot)
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Jest
        run: npm test

  test-server:
    name: Test (server)
    runs-on: ubuntu-latest

    services:
      # Schema and constraint tests run against a real Postgres. Without
      # TEST_DATABASE_URL they self-skip, so a contributor without Docker can
      # still run the suite - but CI always enforces them.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://test:test@127.0.0.1:5432/test

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # server/ imports @almosthadai/shared from its build output.
      - name: Build workspaces
        run: npm run build

      - name: Vitest
        run: npm run test:server

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Build only - no registry push. The deploy workflow arrives with the VPS.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: almosthadai-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          docker run --rm -d --name ci-server \
            -e DATABASE_URL=postgres://u:p@localhost:5432/db \
            -e REDIS_URL=redis://localhost:6379 \
            -p 3000:3000 \
            almosthadai-server:ci

          for i in $(seq 1 15); do
            if curl -fsS http://localhost:3000/healthz > /dev/null; then
              echo "Server healthy"
              curl -fsS http://localhost:3000/healthz
              docker rm -f ci-server
              exit 0
            fi
            sleep 2
          done

          echo "Server never became healthy"
          docker logs ci-server
          docker rm -f ci-server
          exit 1

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    # Deliberately a separate job: an upstream advisory should fail visibly on its
    # own rather than blocking an unrelated PR from merging.
    continue-on-error: false

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit
        run: npm audit --audit-level=high
