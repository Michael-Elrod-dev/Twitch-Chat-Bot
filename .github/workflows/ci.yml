name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch cancels the previous run - no point finishing a
# build for a commit that has already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # ci, not install: installs exactly what the lockfile says and fails if
      # package.json and the lockfile disagree.
      - name: Install dependencies
        run: npm ci

      # Covers the legacy JS bot and the TypeScript workspaces in one pass.
      - name: Lint
        run: npx eslint .

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tsc -b walks the project references, so shared/ is built before server/.
      - name: Typecheck
        run: npm run typecheck

  test-legacy:
    name: Test (legacy bot)
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Jest
        run: npm test

  test-server:
    name: Test (server)
    runs-on: ubuntu-latest

    services:
      # Schema and constraint tests run against a real Postgres. Without
      # TEST_DATABASE_URL they self-skip, so a contributor without Docker can
      # still run the suite - but CI always enforces them.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://test:test@127.0.0.1:5432/test

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # server/ imports @almosthadai/shared from its build output.
      - name: Build workspaces
        run: npm run build

      - name: Vitest
        run: npm run test:server

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest

    # The composition root migrates at boot and bootstraps channels from the
    # database, so the smoke test needs real dependencies to be a real test.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Build only - no registry push. The deploy workflow arrives with the VPS.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: almosthadai-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Boots the real composition root against real dependencies and drives a
      # signed synthetic EventSub delivery at it. A green run means migrations,
      # Redis, the webhook and its HMAC all work in the built image - not merely
      # that the process starts.
      #
      # The image sets NODE_ENV=production, so it is subject to the production
      # config rules. That is the point: this job exists to catch an image that
      # compiles but cannot boot, and supplying less than production requires
      # would be testing something nobody deploys.
      - name: Smoke-test the image
        env:
          EVENTSUB_SECRET: ci-smoke-test-eventsub-secret
        run: |
          set -uo pipefail

          # Generated per run rather than committed: a test key in the repo is
          # still a key in the repo.
          TOKEN_KEY=$(openssl rand -base64 32)
          JWT_KEY=$(openssl rand -base64 48 | tr -d '\n')

          # The negative first. Production's boot refusal is a security control,
          # and a control that is never exercised is one nobody knows is broken.
          # It also documents why the key below is required.
          echo "== the image must REFUSE to boot in production with no encryption key =="
          if docker run --rm --name ci-refusal \
              -e DATABASE_URL=postgres://test:test@127.0.0.1:5432/test \
              -e REDIS_URL=redis://127.0.0.1:6379 \
              -e TWITCH_EVENTSUB_SECRET="$EVENTSUB_SECRET" \
              almosthadai-server:ci > /tmp/refusal.log 2>&1; then
            echo "::error::Image booted in production without TOKEN_ENCRYPTION_KEY"
            exit 1
          fi

          if ! grep -q 'TOKEN_ENCRYPTION_KEY' /tmp/refusal.log; then
            echo "::error::Image failed to boot, but not for the expected reason:"
            cat /tmp/refusal.log
            exit 1
          fi
          echo "refused as designed"

          # No --rm here: a container that dies takes its logs with it, which is
          # how a boot refusal previously surfaced as nothing but curl: (7).
          echo "== booting properly configured =="
          docker run -d --name ci-server --network host \
            -e DATABASE_URL=postgres://test:test@127.0.0.1:5432/test \
            -e REDIS_URL=redis://127.0.0.1:6379 \
            -e TWITCH_EVENTSUB_SECRET="$EVENTSUB_SECRET" \
            -e TOKEN_ENCRYPTION_KEY="$TOKEN_KEY" \
            -e JWT_SECRET="$JWT_KEY" \
            almosthadai-server:ci

          cleanup() { docker rm -f ci-server >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          ready=false
          for i in $(seq 1 20); do
            # Liveness of the CONTAINER before polling the port. A process that
            # has exited will never answer, and spending 40s discovering that
            # buries the exit reason under a wall of connection refusals.
            running=$(docker inspect -f '{{.State.Running}}' ci-server 2>/dev/null || echo false)
            if [ "$running" != "true" ]; then
              code=$(docker inspect -f '{{.State.ExitCode}}' ci-server 2>/dev/null || echo '?')
              echo "::error::Container exited during startup (exit code $code)"
              docker logs ci-server
              exit 1
            fi

            if curl -fsS --max-time 5 http://localhost:3000/readyz > /dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" != "true" ]; then
            echo "::error::Server never became ready"
            docker logs ci-server
            exit 1
          fi

          echo "readyz: $(curl -fsS http://localhost:3000/readyz)"

          # The API must refuse an unauthenticated caller.
          me=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/v1/me)
          if [ "$me" != "401" ]; then
            echo "::error::/api/v1/me should be 401 unauthenticated, got $me"
            docker logs ci-server
            exit 1
          fi
          echo "unauthenticated /api/v1/me -> 401"

          # An unsigned webhook delivery must be refused.
          forged=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://localhost:3000/eventsub/webhook \
            -H 'content-type: application/json' \
            -H 'twitch-eventsub-message-id: forged' \
            -H 'twitch-eventsub-message-type: notification' \
            -H "twitch-eventsub-message-timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -H 'twitch-eventsub-message-signature: sha256=0000' \
            -d '{}')

          if [ "$forged" != "403" ]; then
            echo "::error::Unsigned webhook delivery was not refused (got $forged)"
            docker logs ci-server
            exit 1
          fi
          echo "unsigned webhook delivery -> 403"

          # And a correctly-signed one must be accepted. Signed with node
          # builtins only, so this job needs no npm install.
          node - <<'NODE'
          const { createHmac, randomUUID } = require('node:crypto');

          const secret = process.env.EVENTSUB_SECRET;
          const id = randomUUID();
          const timestamp = new Date().toISOString();
          const body = JSON.stringify({
            subscription: {
              id: randomUUID(), type: 'channel.chat.message', version: '1', status: 'enabled',
              condition: { broadcaster_user_id: '1001', user_id: 'bot' }
            },
            event: {
              broadcaster_user_id: '1001', broadcaster_user_login: 'alpha', broadcaster_user_name: 'Alpha',
              chatter_user_id: '55555', chatter_user_login: 'viewer', chatter_user_name: 'Viewer',
              message_id: randomUUID(), message: { text: '!discord' }, badges: [],
              channel_points_custom_reward_id: null
            }
          });
          const signature = 'sha256=' + createHmac('sha256', secret).update(id + timestamp).update(body).digest('hex');

          // stdin runs as CommonJS, which has no top-level await.
          (async () => {
            const response = await fetch('http://localhost:3000/eventsub/webhook', {
              method: 'POST',
              headers: {
                'content-type': 'application/json',
                'twitch-eventsub-message-id': id,
                'twitch-eventsub-message-type': 'notification',
                'twitch-eventsub-message-timestamp': timestamp,
                'twitch-eventsub-message-signature': signature
              },
              body
            });

            console.log('signed delivery ->', response.status);
            if (!response.ok) process.exit(1);
          })();
          NODE

          echo "== image smoke test passed =="
          docker logs ci-server

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    # Deliberately a separate job: an upstream advisory should fail visibly on its
    # own rather than blocking an unrelated PR from merging.
    continue-on-error: false

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit
        run: npm audit --audit-level=high
