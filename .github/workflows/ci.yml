name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch cancels the previous run - no point finishing a
# build for a commit that has already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # ci, not install: installs exactly what the lockfile says and fails if
      # package.json and the lockfile disagree.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint src/ tests/

      - name: Test
        run: npm test

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    # Deliberately a separate job: an upstream advisory should fail visibly on its
    # own rather than blocking an unrelated PR from merging.
    continue-on-error: false

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit
        run: npm audit --audit-level=high
