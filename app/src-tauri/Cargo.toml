[package]
name = "almosthadai-app"
version = "0.1.0"
description = "Desktop client for the AlmostHadAI Twitch bot"
edition = "2021"
rust-version = "1.77.2"

[lib]
# Tauri 2 builds the app as a library so the mobile targets can link it. The
# `_lib` suffix avoids colliding with the binary's own name on Windows.
name = "almosthadai_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Both are required by `tauri::generate_context!`, which expands into code that
# names them at the crate root — they are not optional even though nothing in
# this file references them directly.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"

# HTTP from Rust rather than from the webview. The webview's origin is
# `http://tauri.localhost`, so every API call would be a cross-origin request
# the server does not (and should not have to) permit — the API's client is a
# desktop app, not a web page, and adding CORS to serve it would open the API
# to every page a user visits. The scope in capabilities/default.json is what
# limits where these requests may go.
tauri-plugin-http = "2"

# Auto-update against GitHub Releases. Windows code signing is deferred (owner
# decision — unsigned installer, SmartScreen click accepted for a two-person
# audience), but Tauri's own update signing is independent of that and keeps
# updates cryptographically verified regardless.
tauri-plugin-updater = "2"

# Only the desktop targets take single-instance; it is what makes a deep link
# reach the window that is already open rather than launching a second copy.
[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
