name: almosthadai

services:
  server:
    build:
      context: .
      target: runtime
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Runtime connects as the least-privilege role (design §4.1 guardrail 3):
      # it can read and write data but cannot create roles or databases, and does
      # not own the tables. Migrations use the owner role below, on a connection
      # that is opened and closed at boot.
      DATABASE_URL: postgres://almosthadai_app:${APP_DB_PASSWORD:-devpassword}@postgres:5432/almosthadai
      MIGRATION_DATABASE_URL: postgres://almosthadai:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/almosthadai
      REDIS_URL: redis://redis:6379
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:-}
      EVENTSUB_DRY_RUN: ${EVENTSUB_DRY_RUN:-true}
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Development placeholder so `docker compose up` needs no configuration.
      # The server refuses to start on this value when NODE_ENV=production.
      TWITCH_EVENTSUB_SECRET: ${TWITCH_EVENTSUB_SECRET:-dev-only-eventsub-secret-change-me}
      BOT_TWITCH_USER_ID: ${BOT_TWITCH_USER_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:17
    # Bound to loopback only: reachable for psql, drizzle-kit and the ETL from
    # this machine, never from the network.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: almosthadai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: almosthadai
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U almosthadai -d almosthadai"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Placeholder until the VPS exists. Terminates TLS and fronts the server;
  # the EventSub webhook callback will need this on :443 with a real hostname.
  caddy:
    image: caddy:2-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - server
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
